name: Build and Publish

# Tag-only on purpose. The filter used to read
#
#     push:
#       paths-ignore: ['README.md']
#       tags: ['*']
#
# which suggests "every push except README-only ones" while the `tags` filter restricts
# matching to tag refs, so it never ran for branch pushes. Keep this file named build.yml:
# PyPI trusted publishing is bound to the repository plus the workflow file name, and the
# last publish (0.10.0) was 2025-07-07, long enough ago that nothing here is proven.
on:
  push:
    tags:
      - '*'

jobs:
  test:
    name: Test with different Python versions
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --extra test --extra visu

      - name: Build the package
        run: uv build

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-24.04
    needs: test
    # This job publishes to PyPI. The trigger is already tag-only; the condition is here so
    # that changing the trigger later cannot silently make publishing run off a branch head.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Check the tag matches the project version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Build the package
        run: uv build

      - name: Publish
        run: uv publish
