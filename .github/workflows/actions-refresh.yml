name: Refresh action pins

# Dependabot's github-actions ecosystem went silent on 2026-05-02, the same day its uv one
# did, and unlike the lockfile nothing else watches these pins. The first dry run of this
# script found every workflow still on actions/checkout@v6 and actions/setup-python@v6
# while upstream is at v7 - five months of drift nobody noticed.
#
# See lock-refresh.yml for why verification happens in this job rather than on the PR it
# opens, and why gh pr create is allowed to fail.
on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      probe_pr_creation:
        description: "Create and immediately close a throwaway PR to verify workflow PR permissions"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The "Allow GitHub Actions to create and approve pull requests" setting is not
      # readable through the REST or GraphQL API, so the only way to know is to try it.
      # Dispatch by hand with the input ticked to re-check after changing that setting.
      - name: Probe workflow pull-request permissions
        if: ${{ inputs.probe_pr_creation }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A ref cannot be both a file and a directory, so this prefix must not collide
          # with any existing branch name; it is removed again at the end of the step.
          branch="probe/workflow-pr-permissions/$(date -u +%Y-%m-%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          {
            echo "Throwaway branch created by a workflow_dispatch of actions-refresh.yml."
            echo "Created at $(date -u +%FT%TZ) to test whether the github-actions token may open pull requests."
          } > .github/PR_PERMISSION_PROBE.md
          git add .github/PR_PERMISSION_PROBE.md
          git commit -m "ci: probe workflow pull-request permissions"
          git push -u origin "$branch" || { echo "::error::could not push the probe branch"; exit 1; }

          if url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "ci: workflow permission probe (close me)" \
            --body "Created by a workflow_dispatch of the refresh workflow to check that Actions may open pull requests. Nothing here needs reviewing - close it."); then
            number=$(printf '%s' "$url" | grep -oE '[0-9]+$')
            gh pr close "$number" --delete-branch --comment "probe finished, closing" || true
            {
              echo "## Workflow pull-request creation: permitted"
              echo ""
              echo "Opened and closed #$number with the github-actions token."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::workflow pull-request creation is still blocked"
            git push origin --delete "$branch" || true
            {
              echo "## Workflow pull-request creation: blocked"
              echo ""
              echo "_Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests_ is still off, so both refresh workflows will keep pushing verified branches instead of filing PRs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Back to the dispatched ref, otherwise a probe run would leave the later steps
          # committing the lockfile or pin changes onto the probe branch.
          git checkout -q "$GITHUB_REF_NAME"
          git branch -D "$branch" >/dev/null 2>&1 || true

      - name: Raise the pins to their current majors
        run: python3 .github/scripts/bump_action_pins.py

      - name: Check the rewritten workflows are valid
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_workflows.py

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "action pins are current, nothing to propose"
            exit 0
          fi

          pending=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("action-refresh/"))] | length')
          if [ "$pending" != "0" ]; then
            echo "an action refresh PR is already open, leaving it alone"
            exit 0
          fi

          branch="action-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows
          git commit -m "ci: raise action pins to their current majors"
          git push -u origin "$branch"

          # Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
          # approve pull requests"; without it, keep the branch and point at it instead of
          # turning the schedule red.
          if ! gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "ci: raise action pins to their current majors" \
            --body "Scheduled run of \`.github/scripts/bump_action_pins.py\`. The workflow files were re-parsed after rewriting, and the ci matrix runs against this branch before anything is merged."; then
            echo "::warning::could not open a pull request; the branch $branch is pushed"
            {
              echo "## Action pins raised - open the pull request by hand"
              echo ""
              echo "[Open the pull request for \`$branch\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$branch?expand=1)"
              echo ""
              echo "Automating this needs _Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests_."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
